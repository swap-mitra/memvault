[package]
name = "memvault-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "memvault"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
memvault-core = { path = "../memvault-core" }
uuid = { version = "1.24.1", features = ["v4"] }

[dev-dependencies]
redb = "4.1.0"
